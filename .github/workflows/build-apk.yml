name: Build APK

# 手动触发或打 tag 时自动构建 APK。
# 用途：不想在本地装 Android Studio / SDK 时，把仓库推到 GitHub，
#       在 Actions 页面点一次「Run workflow」即可下载成品 APK。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v3

      - name: 还原签名密钥（可选）
        # 未配置 Secret 时构建未签名 release。
        # 不能在 step 级 if 里判断同一步的 env：step env 在条件求值时还不可用，
        # 会把这一步永远跳过（v2.6.0 之前的 CI 就是这样出未签名包的）。
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "未配置 KEYSTORE_BASE64，将构建未签名 release"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > qbot-release.jks
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          STORE_FILE=../qbot-release.jks
          STORE_PASSWORD=$STORE_PASSWORD
          KEY_ALIAS=$KEY_ALIAS
          KEY_PASSWORD=$KEY_PASSWORD
          EOF

      - name: 运行协议层测试
        # botcore 是纯 JVM 模块，无需 Android SDK；测试不过就不浪费后面的全量构建时间。
        run: ./gradlew :botcore:test --no-daemon

      - name: 构建 Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: 校验签名
        # 配了密钥就必须验签：Secret 错、key 不匹配或回退成未签名包时，直接让流水线失败。
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          if [ ! -f qbot-release.jks ]; then
            echo "未配置密钥，跳过签名校验（产物为未签名包）"
            exit 0
          fi
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify -v --print-certs "$APK"
          SHA=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          echo "证书 SHA-256：$SHA"
          test "$SHA" = "d335bf6ec16e9124ed5c27ab75a1e6570d0cda389b76e809b132f911a2c6494e"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: QBotMobile-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
