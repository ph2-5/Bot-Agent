name: Build APK

# 手动触发或打 tag 时自动构建 APK。
# 用途：不想在本地装 Android Studio / SDK 时，把仓库推到 GitHub，
#       在 Actions 页面点一次「Run workflow」即可下载成品 APK。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v3

      - name: 还原签名密钥（可选）
        # 未配置 Secret 时会自动跳过，构建出未签名的 release 包。
        # 注意：secrets 上下文不能出现在 step 级 if 中，需经 env 中转。
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > qbot-release.jks
          cat > local.properties <<EOF
          STORE_FILE=../qbot-release.jks
          STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: 构建 Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: QBotMobile-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
